[build-system]
requires = [
    "setuptools >= 77",
]
build-backend = "setuptools.build_meta"

[project]
name = "license-expression"
authors = [
    {name = "nexB. Inc. and others", email = "info@aboutcode.org"},
]
description = "comprehensive utility library to parse, compare, simplify and normalize license expressions (such as SPDX license expressions) using boolean logic"
readme = "README.rst"
keywords = [
    "open source",
    "license expression",
    "license",
    "spdx",
    "boolean",
    "parse expression",
    "normalize expression",
    "compare expression",
    "licence",
]
license = "Apache-2.0"
license-files = [
    "apache-2.0.LICENSE",
    "NOTICE",
    "AUTHORS.rst",
    "CHANGELOG.rst",
    "CODE_OF_CONDUCT.rst",
    "README.rst",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "boolean.py >= 4.0",
]
version = "30.4.4"

[project.urls]
Homepage = "https://github.com/aboutcode-org/license-expression"

[dependency-groups]
tests = [
    "pytest >= 7.0.1",
    "pytest-xdist >= 2",
]
lint = [
    "twine",
    "ruff",
]
docs = [
    # do not use this as this triggers a bug
    # in setuptools_scm:aboutcode-toolkit >= 6.0.0
    "doc8>=0.11.2",
    "Sphinx>=5.0.2",
    "sphinx-rtd-theme>=1.0.0",
    "sphinxcontrib-apidoc >= 0.4.0",
    "sphinx-reredirects >= 0.1.2",
    "sphinx-autobuild",
    "sphinx-rtd-dark-mode>=1.3.0",
    "sphinx-copybutton",
]

dev = [
    {include-group = "tests"},
    {include-group = "lint"},
    {include-group = "docs"},
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# this is used populated when creating a git archive
# and when there is .git dir and/or there is no git installed
fallback_version = "9999.$Format:%h-%cs$"

[tool.pytest.ini_options]
norecursedirs = [
   ".git",
   "bin",
   "dist",
   "build",
   "_build",
   "etc",
   "local",
   "ci",
   "docs",
   "man",
   "share",
   "samples",
   ".cache",
   ".settings",
   "Include",
   "include",
   "Lib",
   "lib",
   "lib64",
   "Lib64",
   "Scripts",
   "thirdparty",
   "tmp",
   "venv",
   ".venv",
   "tests/data",
   "*/tests/test_data",
   ".eggs",
   "src/*/data",
   "tests/*/data"
]

python_files = "*.py"

python_classes = "Test"
python_functions = "test"

addopts = [
    "-rfExXw",
    "--strict-markers",
    "--doctest-modules"
]

[tool.ruff]
line-length = 100
extend-exclude = []
target-version = "py310"
include = [
  "pyproject.toml",
  "src/**/*.py",
  "etc/**/*.py",
  "test/**/*.py",
  "tests/**/*.py",
  "doc/**/*.py",
  "docs/**/*.py",
  "*.py",
  "."

]
# ignore test data and testfiles: they should never be linted nor formatted 
exclude = [
# main style
  "**/tests/data/**/*",
# scancode-toolkit
  "**/tests/*/data/**/*",
# dejacode, purldb
  "**/tests/testfiles/**/*",
# vulnerablecode, fetchcode
  "**/tests/*/test_data/**/*",
  "**/tests/test_data/**/*",
# django migrations
  "**/migrations/**/*"
]

[tool.ruff.lint]
# Rules: https://docs.astral.sh/ruff/rules/
select = [
#    "E",  # pycodestyle
#    "W",  # pycodestyle warnings
    "D",  # pydocstyle
#    "F",  # Pyflakes
#    "UP", # pyupgrade
#    "S",  # flake8-bandit
    "I",  # isort
#    "C9", # McCabe complexity
]
ignore = ["D1", "D200", "D202", "D203", "D205", "D212", "D400", "D415", "I001"]


[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 1
default-section = "first-party"
known-first-party = ["src", "tests", "etc/scripts/**/*.py"]
known-third-party = ["click", "pytest"]

sections = { django = ["django"] }
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Place paths of files to be ignored by ruff here
"tests/*" = ["S101"]
"test_*.py" = ["S101"]


[tool.doc8]
ignore-path = ["docs/build", "doc/build", "docs/_build", "doc/_build"]
max-line-length=100
